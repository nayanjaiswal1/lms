# Always-on dev stack for the ideapad box, layered on docker-compose.dev.yml:
#   docker compose -f docker-compose.dev.yml -f docker-compose.ideapad.yml up -d <services>
# Edit code on the box (VS Code Remote-SSH); Air reloads the backend, `next dev`
# reloads the UI. Memory-capped so it can't starve Jenkins/k3s on the same host.
# Open: http://ideapad:8088
x-public: &public http://ideapad:8088

services:
  frontend:
    build: !reset null
    image: oven/bun:1.3.14
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      HOME: /tmp
      BUN_INSTALL_CACHE_DIR: /tmp/bun-cache
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_APP_URL: *public
      NEXT_PUBLIC_MEDIA_URL: *public
      NEXT_PUBLIC_LAB_PROXY_URL: ws://ideapad:8088/lab-ws
    command: sh -c "bun install --frozen-lockfile && bun run dev -H 0.0.0.0"
    healthcheck:
      start_period: 240s
    mem_limit: 1536m

  backend:
    environment:
      FRONTEND_URL: *public
      BACKEND_URL: *public
      MCP_PUBLIC_URL: *public
      CORS_EXTRA_ORIGINS: *public
    mem_limit: 1536m

  caddy:
    ports: !override
      - "8088:80"
    mem_limit: 128m

  labproxy:
    mem_limit: 256m

  minio:
    mem_limit: 384m

  piston:
    mem_limit: 768m
