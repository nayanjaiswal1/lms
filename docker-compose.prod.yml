version: "3.9"

networks:
  mindforge_prod:
    driver: bridge
  # Joined by lab sandbox containers spawned dynamically via `docker run` in
  # internal/labs/container.go, and by labproxy, which dials them directly by
  # container-ID hostname for the in-browser terminal WebSocket relay.
  # Create once, before first deploy: docker network create mindforge-labs
  mindforge-labs:
    name: mindforge-labs
    external: true

volumes:
  mindforge_pg_prod:
  mindforge_minio_prod:
  mindforge_piston_prod:
  mindforge_caddy_data:
  mindforge_caddy_config:

services:
  postgres:
    image: postgres:16-alpine
    container_name: mindforge_postgres_prod
    restart: always
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mindforge_pg_prod:/var/lib/postgresql/data
    networks:
      - mindforge_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: mindforge_redis_prod
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - mindforge_prod
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: mindforge_minio_prod
    restart: always
    env_file: .env.prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address :9001
    # No public ports — the S3 API is reached over mindforge_prod by the
    # backend directly, and by browsers indirectly through Caddy (see
    # Caddyfile), which proxies the bucket path so presigned URL signatures
    # (bound to MINIO_PUBLIC_ENDPOINT) stay valid end-to-end.
    networks:
      - mindforge_prod
    volumes:
      - mindforge_minio_prod:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: mindforge_piston_prod
    restart: always
    privileged: true
    volumes:
      - mindforge_piston_prod:/piston
    networks:
      - mindforge_prod
    healthcheck:
      # piston's image has neither wget nor curl; node is the one HTTP-capable
      # binary guaranteed to be on PATH in this image.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindforge_backend_prod
    restart: always
    env_file: .env.prod
    # The Go server shells out to `docker` to spawn/exec/stop lab sandbox
    # containers (internal/labs/container.go) — needs the host socket.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # No published port — only Caddy (proxying /api/*) reaches this, over
    # mindforge_prod. Publishing 8080 to the host would let anyone bypass
    # Caddy's TLS termination and hit the API over plain HTTP.
    networks:
      - mindforge_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      piston:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  labproxy:
    build:
      context: ./backend
      dockerfile: Dockerfile.labproxy
    container_name: mindforge_labproxy_prod
    restart: always
    environment:
      LABPROXY_PORT: "8081"
      LABPROXY_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LABPROXY_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LABPROXY_JWT_SECRET: ${JWT_SECRET}
      LABPROXY_JWT_ISSUER: mindforge-labproxy
    networks:
      - mindforge_prod
      - mindforge-labs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
        NEXT_PUBLIC_LAB_PROXY_URL: ${NEXT_PUBLIC_LAB_PROXY_URL}
    container_name: mindforge_frontend_prod
    restart: always
    env_file: .env.prod
    # No published port — only Caddy reaches this, over mindforge_prod.
    networks:
      - mindforge_prod
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: mindforge_caddy_prod
    restart: always
    env_file: .env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - mindforge_caddy_data:/data
      - mindforge_caddy_config:/config
    networks:
      - mindforge_prod
    depends_on:
      - backend
      - frontend
      - labproxy
      - minio
