version: "3.9"

networks:
  mindforge_prod:
    driver: bridge
  # Backend <-> Piston only, so a Piston escape/compromise has no L3 path to
  # Postgres, Redis or MinIO.
  mindforge_piston:

volumes:
  mindforge_pg_prod:
  mindforge_minio_prod:
  mindforge_piston_prod:
  mindforge_caddy_data:
  mindforge_caddy_config:
  mindforge_prometheus_prod:
  mindforge_grafana_prod:

services:
  postgres:
    image: postgres:16-alpine
    container_name: mindforge_postgres_prod
    restart: always
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mindforge_pg_prod:/var/lib/postgresql/data
    networks:
      - mindforge_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: mindforge_redis_prod
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - mindforge_prod
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: mindforge_minio_prod
    restart: always
    env_file: .env.prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address :9001
    # No public ports — the S3 API is reached over mindforge_prod by the
    # backend directly, and by browsers indirectly through Caddy (see
    # Caddyfile), which proxies the bucket path so presigned URL signatures
    # (bound to MINIO_PUBLIC_ENDPOINT) stay valid end-to-end.
    networks:
      - mindforge_prod
    volumes:
      - mindforge_minio_prod:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  piston:
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    container_name: mindforge_piston_prod
    restart: always
    # Piston's isolate sandbox needs cgroup/namespace/mount setup that only
    # works privileged; this cannot be dropped without breaking code
    # execution (see docs/infrastructure.md "Residual host-root risk").
    # Mitigation: it sits on its own network, reachable only by the backend.
    privileged: true
    mem_limit: 4g
    volumes:
      - mindforge_piston_prod:/piston
    networks:
      - mindforge_piston
    healthcheck:
      # piston's image has neither wget nor curl; node is the one HTTP-capable
      # binary guaranteed to be on PATH in this image.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindforge_backend_prod
    restart: always
    env_file: .env.prod
    # Lab sandboxes run on a SEPARATE lab host (docker-compose.labhost.yml).
    # The backend never touches a Docker socket: it calls the lab agent there
    # over mTLS (LABS_AGENT_URL, e.g. https://10.0.0.2:8443). Client cert, key
    # and the CA that signed the agent's server cert live in ./labs-agent-certs.
    environment:
      LABS_AGENT_URL: ${LABS_AGENT_URL}
      LABS_AGENT_CA_FILE: /run/labs-agent/ca.pem
      LABS_AGENT_CERT_FILE: /run/labs-agent/client.pem
      LABS_AGENT_KEY_FILE: /run/labs-agent/client.key
    volumes:
      - ./labs-agent-certs:/run/labs-agent:ro
    # No published port — only Caddy (proxying /api/*) reaches this, over
    # mindforge_prod. Publishing 8080 to the host would let anyone bypass
    # Caddy's TLS termination and hit the API over plain HTTP.
    networks:
      - mindforge_prod
      - mindforge_piston
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      piston:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mindforge_prometheus_prod
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./metrics_token:/etc/prometheus/metrics_token:ro
      - mindforge_prometheus_prod:/prometheus
    # No published port — same reasoning as backend above: only reachable
    # inside mindforge_prod. Reach it with an SSH tunnel or a temporary
    # `docker compose -f docker-compose.prod.yml port prometheus 9090` when
    # you need to browse it, or point Grafana at it from the same network
    # later if dashboards are worth adding.
    networks:
      - mindforge_prod
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mindforge_grafana_prod
    restart: always
    env_file: .env.prod
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - mindforge_grafana_prod:/var/lib/grafana
    # No published port — same reasoning as prometheus above. Reach it with
    # an SSH tunnel or `docker compose -f docker-compose.prod.yml port
    # grafana 3000`, or add a Caddy route gated behind platform-admin auth
    # if always-on browser access is actually needed later.
    networks:
      - mindforge_prod
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
        NEXT_PUBLIC_LAB_PROXY_URL: ${NEXT_PUBLIC_LAB_PROXY_URL}
        NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED}
        NEXT_PUBLIC_GITHUB_OAUTH_ENABLED: ${NEXT_PUBLIC_GITHUB_OAUTH_ENABLED}
    container_name: mindforge_frontend_prod
    restart: always
    env_file: .env.prod
    # No published port — only Caddy reaches this, over mindforge_prod.
    networks:
      - mindforge_prod
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    # Custom build instead of a bare image: the preview subdomain's wildcard
    # cert (see Caddyfile's *.{$LABPROXY_PREVIEW_DOMAIN} block) needs DNS-01
    # issuance, which stock caddy:2-alpine has no provider module for — see
    # Dockerfile.caddy.
    build:
      context: .
      dockerfile: Dockerfile.caddy
      args:
        CADDY_DNS_PROVIDER: ${CADDY_DNS_PROVIDER:-cloudflare}
    container_name: mindforge_caddy_prod
    restart: always
    env_file: .env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - mindforge_caddy_data:/data
      - mindforge_caddy_config:/config
    networks:
      - mindforge_prod
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
