apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level `namespace:` field here — every base resource already sets its
# own namespace explicitly (mindforge or mindforge-labs), and Kustomize's
# namespace transformer overwrites ALL namespaced resources unconditionally
# when set, which would collapse that mindforge/mindforge-labs split.

resources:
  - ../../base

# Produces the "mindforge-secrets" Secret every base Deployment references via
# envFrom.secretRef — Kustomize automatically rewrites those references to
# the generated (hash-suffixed) name, so the Secret rotates and triggers a
# rollout whenever secrets.env content changes.
secretGenerator:
  - name: mindforge-secrets
    namespace: mindforge
    envs:
      - secrets.env

# Domain-dependent values. configmap-domain.patch.yaml covers app env vars —
# edit it for your real domain. The Gateway/HTTPRoute hostnames below use
# JSON6902 ops instead of a strategic-merge file: edit the "value:" lines to
# your real domain too. (Gateway API's `listeners` is a list inside a CRD —
# no patchMergeKey metadata for kustomize to merge by — so a strategic-merge
# patch there would silently replace the WHOLE listeners array, dropping
# port/protocol/tls/allowedRoutes. JSON6902 touches only the exact field.)
patches:
  - path: configmap-domain.patch.yaml
  - target:
      kind: Gateway
      name: mindforge
    patch: |-
      - op: replace
        path: /spec/listeners/0/hostname
        value: app.yourdomain.com
      - op: replace
        path: /spec/listeners/1/hostname
        value: app.yourdomain.com
  - target:
      kind: HTTPRoute
      name: mindforge-redirect
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: app.yourdomain.com
  - target:
      kind: HTTPRoute
      name: mindforge
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: app.yourdomain.com

# Placeholder — overwritten by `scripts/build-push-k8s-images.sh`, which runs
# `kustomize edit set image` after building and pushing each image to $REGISTRY.
images:
  - name: mindforge-backend
    newName: REPLACE_ME_REGISTRY/mindforge-backend
    newTag: latest
  - name: mindforge-labproxy
    newName: REPLACE_ME_REGISTRY/mindforge-labproxy
    newTag: latest
  - name: mindforge-frontend
    newName: REPLACE_ME_REGISTRY/mindforge-frontend
    newTag: latest
