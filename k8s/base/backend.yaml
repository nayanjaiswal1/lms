apiVersion: v1
kind: ServiceAccount
metadata:
  name: mindforge-backend
  namespace: mindforge
---
# Grants the backend just enough Kubernetes API access to run
# internal/labs/runtime_kubernetes.go: create/inspect/delete lab sandbox Pods
# and exec into them for setup scripts and task verification. Scoped to the
# mindforge-labs namespace only — the backend has no access to any other
# namespace's resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mindforge-backend-labs
  namespace: mindforge-labs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mindforge-backend-labs
  namespace: mindforge-labs
subjects:
  - kind: ServiceAccount
    name: mindforge-backend
    namespace: mindforge
roleRef:
  kind: Role
  name: mindforge-backend-labs
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mindforge
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mindforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: mindforge-backend
      containers:
        - name: backend
          image: mindforge-backend:latest # replaced by the overlay's images: transformer
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mindforge-config
            - secretRef:
                name: mindforge-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
