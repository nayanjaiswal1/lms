# Reference only — NOT applied by kustomization.yaml and not consumed by any
# Deployment directly. Shows every key the "mindforge-secrets" Secret must
# contain; the real Secret is generated by k8s/overlays/prod's
# secretGenerator from a gitignored k8s/overlays/prod/secrets.env (see
# secrets.env.example in that directory), or by your own secret manager
# (sealed-secrets, external-secrets, your cloud KMS) — anything that produces
# a Secret named "mindforge-secrets" in the mindforge namespace with these keys.
apiVersion: v1
kind: Secret
metadata:
  name: mindforge-secrets
  namespace: mindforge
type: Opaque
stringData:
  # Database
  POSTGRES_USER: mindforge
  POSTGRES_PASSWORD: change_me_very_strong_prod_password
  POSTGRES_DB: mindforge_prod
  DATABASE_URL: postgres://mindforge:change_me_very_strong_prod_password@postgres:5432/mindforge_prod
  # labproxy reads its own env var name for the same connection string.
  LABPROXY_DB_URL: postgres://mindforge:change_me_very_strong_prod_password@postgres:5432/mindforge_prod

  # Redis
  REDIS_PASSWORD: change_me_strong_redis_password
  REDIS_URL: redis://:change_me_strong_redis_password@redis:6379/0
  LABPROXY_REDIS_URL: redis://:change_me_strong_redis_password@redis:6379/0

  # JWT / session — all three must differ, min 32 bytes, not "change_me*"
  JWT_SECRET: change_me_prod_jwt_secret_min_32_bytes_random_string
  COOKIE_SECRET: change_me_prod_cookie_secret_min_32_bytes_random_str
  ENCRYPTION_KEY: change_me_prod_encryption_key_exactly_32bytes!!
  # Must equal JWT_SECRET — labproxy verifies tokens the backend mints.
  LABPROXY_JWT_SECRET: change_me_prod_jwt_secret_min_32_bytes_random_string

  # OAuth (optional — leave blank to disable a provider)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""

  # SMTP
  SMTP_USER: your_smtp_api_key_or_username
  SMTP_PASS: your_smtp_api_key_or_password

  # Object storage (MinIO) — ACCESS_KEY/SECRET_KEY must equal ROOT_USER/ROOT_PASSWORD
  MINIO_ROOT_USER: mindforge
  MINIO_ROOT_PASSWORD: change_me_very_strong_minio_password
  MINIO_ACCESS_KEY: mindforge
  MINIO_SECRET_KEY: change_me_very_strong_minio_password

  # LLM (optional — leave blank while LLM_PROVIDER=disabled in the ConfigMap)
  LLM_API_KEY: ""

  # Frontend — server-side only, used for resume parsing
  ANTHROPIC_API_KEY: ""
