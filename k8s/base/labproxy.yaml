# No ServiceAccount/RBAC — under LABS_RUNTIME=kubernetes, labproxy never
# touches the container runtime directly (see cmd/labproxy/proxy.go); it only
# dials lab Pods' ttyd port over the cluster network by IP.
apiVersion: v1
kind: Service
metadata:
  name: labproxy
  namespace: mindforge
spec:
  selector:
    app: labproxy
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labproxy
  namespace: mindforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: labproxy
  template:
    metadata:
      labels:
        app: labproxy
    spec:
      containers:
        - name: labproxy
          image: mindforge-labproxy:latest # replaced by the overlay's images: transformer
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: mindforge-config
            - secretRef:
                name: mindforge-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
