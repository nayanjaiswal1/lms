apiVersion: v1
kind: Namespace
metadata:
  name: mindforge
---
# Runs Piston (privileged, sandboxes untrusted user code) and every lab
# session Pod created at runtime by the backend via the Kubernetes API
# (internal/labs/runtime_kubernetes.go). Pod Security Admission is set to
# "privileged" here — Piston cannot run under baseline/restricted. Lab
# session Pods themselves still opt into cap-drop ALL + non-privilege-escalation
# individually (see runtime_kubernetes.go); this namespace label only lifts the
# admission-time restriction that would otherwise reject Piston outright.
# Isolation between lab Pods and the rest of the cluster is enforced by
# networkpolicy-labs.yaml, not by this label.
apiVersion: v1
kind: Namespace
metadata:
  name: mindforge-labs
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
