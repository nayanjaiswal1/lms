apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Opt-in self-hosted Postgres. Default is external Neon (DATABASE_URL in the
# overlay's secrets.env). To switch, add to an overlay's kustomization.yaml:
#   components:
#     - ../../components/in-cluster-postgres
# and set in secrets.env: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, plus
# DATABASE_URL / LABPROXY_DB_URL pointing at host `postgres:5432`.
resources:
  - postgres.yaml
  - networkpolicy.yaml
