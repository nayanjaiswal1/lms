kind: data
id: seed.tz-spread
version: 1.0.0
stack: django
title: Orders around local midnight
summary: The small dataset plus paid orders placed between 22:00 and 02:00 America/New_York over a window that spans a DST change, for timezone and day-bucketing bugs.
category: data
skills:
  - data
  - timezones
requires:
  - cap:tz-reports
params:
  type: object
  properties:
    days:
      type: integer
      minimum: 3
      maximum: 60
      default: 14
    per_day:
      type: integer
      minimum: 2
      maximum: 60
      default: 12
    start_date:
      type: string
      maxLength: 10
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      x-mf-use: text
      default: "2025-03-03"
      description: First local business day (YYYY-MM-DD).
budget:
  setup_seconds: 2
data:
  generator: generate.py
  rows: 1200
