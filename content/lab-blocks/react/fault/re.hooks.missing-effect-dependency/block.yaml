kind: fault
id: re.hooks.missing-effect-dependency
version: 1.0.0
stack: react
title: Changing the status filter does not reload the orders
summary: The orders list reloads when the page changes but not when the status filter changes, because the data effect leaves the status out of its dependency array.
category: hooks
difficulty: intermediate
skills:
- react-hooks
- effect-dependencies
- debugging
requires:
- slot:orders.hook.effect
- cap:vitest
fault:
  inject:
    slots:
    - slot: orders.hook.effect
      value: |
        useEffect(() => {
          let ignore = false;
          setState((current) => ({ ...current, loading: true, error: null }));
          get(`/api/orders?status=${status}&page=${page}`).then(
            (data) => {
              if (!ignore) {
                setState((current) => ({
                  items: data.items,
                  pages: data.pages,
                  loading: false,
                  error: null,
                  updates: current.updates + 1,
                }));
              }
            },
            (error) => {
              if (!ignore) setState((current) => ({ ...current, loading: false, error }));
            },
          );
          return () => {
            ignore = true;
          };
        }, [page]);
  fix:
    slots:
    - slot: orders.hook.effect
      value: |
        useEffect(() => {
          let ignore = false;
