{% extends "base.html" %}
{% block title %}Your cart{% endblock %}
{% block content %}
<h1>Your cart</h1>
<table>
  <thead><tr><th>Product</th><th>Qty</th><th>Price</th></tr></thead>
  <tbody>
  {% for product, quantity in lines %}
    <tr><td>{{ product.name }}</td><td>{{ quantity }}</td><td>${{ product.price }}</td></tr>
  {% empty %}<tr><td colspan="3">Your cart is empty.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
