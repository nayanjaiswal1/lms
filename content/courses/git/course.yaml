title: "Git: Commits, Branches, Merges, Rebase and Recovery"
description: >-
  A hands-on Git course in short, one-idea lessons, each followed by graded labs
  in a real terminal and scenario quizzes. Start from commits, the staging area,
  remotes and authentication; learn branching, merging, conflicts and rebase;
  see how Git works inside (objects, refs, the index, the reflog); undo and
  recover anything with restore, reset, revert, cherry-pick and stash; investigate
  history with blame, pickaxe search and bisect; then work like a team with
  branching strategies, tags and releases, hooks, commit signing, worktrees,
  submodules, large-repo tools and a troubleshooting playbook, ending in a
  capstone feature-to-release workflow and a final exam.
difficulty: beginner
cover_url: "/course-covers/git.png"
tags:
  - git
  - version-control
  - cli
is_free: true
