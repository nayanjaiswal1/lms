title: "45-Day Interview Preparation Bootcamp"
description: >-
  A full-stack engineer interview preparation track (3+ years experience),
  split into independent subjects you can study in any order or pick just
  the ones your own interview loop covers. Data Structures & Algorithms
  covers every core pattern from arrays to dynamic programming with practice
  tests along the way. System Design starts with the foundations
  (estimation, caching, sharding, CAP, messaging, consensus, resilience)
  and builds up to full case-study designs of real products. Low-Level
  Design covers OOP, SOLID, the classic design patterns, and building
  systems like a parking lot or an elevator from scratch. Backend goes
  deep on Python, Django, FastAPI, PostgreSQL, Redis and queues, and API
  design. Frontend covers JavaScript and CSS fundamentals through React
  internals, performance, and TypeScript. Behavioral prep covers STAR
  stories, company research, and interview-day logistics. Every subject
  ends with mock interview rounds and a rubric to grade yourself against.
difficulty: intermediate
