title: "Python: Fundamentals to Advanced"
description: >-
  One Python course from core language to senior-interview depth. The
  Fundamentals block covers types and mutability, copy semantics, functions,
  scope and closures, exceptions, OOP essentials, complexity, optimization and
  testing. The Advanced block covers CPython internals and memory, the GIL,
  threading vs multiprocessing vs asyncio, the data model, iterators and
  generators, serialization, metaclasses, context managers, weak references,
  decorators, dataclasses, functools, descriptors, and advanced typing. Every
  lesson ships runnable "Try it Yourself" Python code boxes.
difficulty: intermediate
