title: "Production Debugging: Fix Real Bugs in a Live-Looking App"
description: >-
  Learn to debug the way it is done at work. Every lab drops you into a small, realistic
  e-commerce application (Django or FastAPI with PostgreSQL, and a React dashboard) inside a browser IDE with a real git
  history, a ticket from support or the on-call channel, logs, a database and a debugger.
  You reproduce the problem, follow the evidence to the root cause, fix it, prove the fix
  with a test that fails on the broken code, and write a short incident note. The Django
  track covers performance and query problems, data-model and money bugs, concurrency,
  migrations, configuration and calls to other services. The FastAPI track covers Alembic
  migrations, async SQLAlchemy performance, event-loop and concurrency bugs, outbound calls and
  error contracts, validation models, proxy configuration and authorization. The React track covers hooks and closures, async races, state and keys, render performance and leaks, and API and build configuration. The Fullstack track covers sessions, cookies and CORS, API contracts, and values that change meaning between browser and API. Each section starts
  with a short lesson on the debugging skill, never on the answer.
difficulty: intermediate
