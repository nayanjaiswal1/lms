version: "3.9"

networks:
  mindforge_dev:
    driver: bridge
  # Joined by lab sandbox containers (spawned dynamically via `docker run` in
  # internal/labs/container.go) and by labproxy, which dials them directly by
  # container-ID hostname for the in-browser terminal WebSocket relay.
  # `external: true` — this network's lifecycle is independent of `compose up`/
  # `down`: lab containers are created and destroyed by the Go backend at
  # runtime, long after (and independent of) any single compose cycle. Create
  # it once with: docker network create mindforge-labs
  mindforge-labs:
    name: mindforge-labs
    external: true
  # Separate bridge for nested-Docker (Docker-in-Docker) lab containers only
  # (see docs/labs.md "Nested Docker labs") — kept off the shared
  # mindforge-labs bridge so an elevated (SYS_ADMIN-holding) container is
  # never L2-adjacent to every other student's unprivileged one, and so a
  # nested dockerd's own docker0/iptables rules can't collide with the
  # platform bridge. Same external lifecycle reasoning as mindforge-labs
  # above. Only created/used when LABS_IMAGE_PROFILES maps an image to the
  # "nested-docker" profile — inert otherwise. Create once with:
  # docker network create mindforge-labs-dind
  mindforge-labs-dind:
    name: mindforge-labs-dind
    external: true

volumes:
  mindforge_pg_dev:
  mindforge_redis_dev:
  mindforge_go_cache:
  mindforge_minio_dev:
  mindforge_piston_dev:

services:
  postgres:
    image: postgres:16-alpine
    container_name: mindforge_postgres_dev
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No published port — only Caddy is host-exposed. Reach this from the host
    # with `docker compose -f docker-compose.dev.yml exec postgres psql -U ... `.
    volumes:
      - mindforge_pg_dev:/var/lib/postgresql/data
    networks:
      - mindforge_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: mindforge_redis_dev
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # No published port — internal-only, same as postgres above.
    volumes:
      - mindforge_redis_dev:/data
    networks:
      - mindforge_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: mindforge_minio_dev
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: mindforge
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address :9001
    # No published port — S3 API is reached by the browser through Caddy's
    # /mindforge/* proxy (see Caddyfile.dev); the 9001 console is dev-only and
    # now reachable only via `docker compose -f docker-compose.dev.yml port minio 9001`
    # or a temporary port-forward, not directly.
    volumes:
      - mindforge_minio_dev:/data
    networks:
      - mindforge_dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    image: golang:1.26-alpine
    container_name: mindforge_backend_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./content:/content
      - mindforge_go_cache:/root/go
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    # No published port — reached through Caddy's /api, /oauth, /.well-known,
    # /mcp routes (Caddyfile.dev), and by labproxy/frontend over the internal
    # network directly.
    networks:
      - mindforge_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      piston:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    command: sh -c "apk add --no-cache docker-cli && go mod download && go install github.com/air-verse/air@latest && air -c .air.toml"

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: mindforge_piston_dev
    restart: unless-stopped
    privileged: true
    volumes:
      - mindforge_piston_dev:/piston
    # No published port — only the backend calls this, over the internal network.
    networks:
      - mindforge_dev
    healthcheck:
      # piston's image has neither wget nor curl; node is the one HTTP-capable
      # binary guaranteed to be on PATH in this image.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  labproxy:
    image: golang:1.26-alpine
    container_name: mindforge_labproxy_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - mindforge_go_cache:/root/go
    environment:
      LABPROXY_PORT: "8081"
      LABPROXY_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LABPROXY_REDIS_URL: redis://redis:6379/0
      LABPROXY_JWT_SECRET: ${JWT_SECRET}
      LABPROXY_JWT_ISSUER: mindforge-labproxy
    # No published port — matches docker-compose.prod.yml/Caddyfile: the
    # terminal WebSocket and live-preview asset routes are reached through
    # Caddy's /lab-ws/* prefix-stripped proxy (Caddyfile.dev), not a raw port.
    networks:
      - mindforge_dev
      - mindforge-labs
      - mindforge-labs-dind
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: go run ./cmd/labproxy

  caddy:
    image: caddy:2-alpine
    container_name: mindforge_caddy_dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    networks:
      - mindforge_dev
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: mindforge_adminer_dev
    restart: unless-stopped
    # No published port — dev-only DB GUI, not worth a Caddy route (its
    # generated pages assume they own the origin root). Use
    # `docker compose -f docker-compose.dev.yml port adminer 8080` and a
    # temporary port-forward, or `docker compose exec postgres psql`, when needed.
    networks:
      - mindforge_dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  frontend:
    # Same production Dockerfile/image as docker-compose.prod.yml — Docker
    # Desktop's Windows bind mount doesn't forward inotify events, so a live
    # dev server in the container never sees host edits anyway. Run `pnpm dev`
    # natively on the host for frontend work; this container just gives the
    # rest of the stack (backend, labs, etc.) something to hit at frontend:3000.
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
        NEXT_PUBLIC_LAB_PROXY_URL: ${NEXT_PUBLIC_LAB_PROXY_URL}
        NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED}
        NEXT_PUBLIC_GITHUB_OAUTH_ENABLED: ${NEXT_PUBLIC_GITHUB_OAUTH_ENABLED}
    container_name: mindforge_frontend_dev
    restart: unless-stopped
    env_file: ./frontend/.env.local
    # No published port — only Caddy reaches this, over mindforge_dev.
    networks:
      - mindforge_dev
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000',{headers:{Host:'localhost'}},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
