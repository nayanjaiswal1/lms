<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Linux: The Atlas Story course cover">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f0a"/>
      <stop offset="55%" stop-color="#1c2a14"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- terminal window -->
  <rect x="560" y="90" width="560" height="300" rx="14" fill="#0a0d08" stroke="#84CC16" stroke-width="3" opacity="0.95"/>
  <rect x="560" y="90" width="560" height="44" rx="14" fill="#1a2412"/>
  <rect x="560" y="120" width="560" height="14" fill="#1a2412"/>
  <circle cx="592" cy="112" r="8" fill="#F87171"/>
  <circle cx="620" cy="112" r="8" fill="#FBBF24"/>
  <circle cx="648" cy="112" r="8" fill="#4ADE80"/>
  <text x="840" y="119" font-family="Menlo, Consolas, monospace" font-size="18" fill="#D9F99D" opacity="0.7" text-anchor="middle">labuser@atlas</text>
  <g font-family="Menlo, Consolas, monospace" font-size="24">
    <text x="588" y="182" fill="#A3E635">$ <tspan fill="#ECFCCB">ssh atlas</tspan></text>
    <text x="588" y="222" fill="#A3E635">$ <tspan fill="#ECFCCB">df -h /var</tspan></text>
    <text x="588" y="258" fill="#FCA5A5">/dev/sda2   40G   40G  0  100%</text>
    <text x="588" y="298" fill="#A3E635">$ <tspan fill="#ECFCCB">journalctl -u brewbot</tspan></text>
    <text x="588" y="342" fill="#A3E635">$ <tspan fill="#ECFCCB">▌</tspan></text>
  </g>

  <!-- coffee cup -->
  <g opacity="0.9">
    <path d="M140 150 h120 v70 a50 50 0 0 1 -50 50 h-20 a50 50 0 0 1 -50 -50 z" fill="#ECFCCB"/>
    <path d="M260 170 a24 24 0 0 1 0 48" fill="none" stroke="#ECFCCB" stroke-width="10"/>
    <path d="M170 135 q-12 -18 0 -36 M200 135 q-12 -18 0 -36 M230 135 q-12 -18 0 -36" fill="none" stroke="#BEF264" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <text x="90" y="500" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#F7FEE7">Linux: The Atlas Story</text>
  <text x="90" y="540" font-family="Arial, sans-serif" font-size="26" fill="#ECFCCB" opacity="0.85">Shell · Permissions · Processes · systemd · Networking · Incidents</text>

  <rect x="90" y="565" width="64" height="6" rx="3" fill="#84CC16"/>
</svg>
