<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Java Mastery course cover">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1410"/>
      <stop offset="55%" stop-color="#5a2e0d"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE7C7"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- steam -->
  <path d="M690 190 q-14 -24 0 -48 q14 -24 0 -48" fill="none" stroke="#FDE7C7" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <path d="M730 190 q-14 -24 0 -48 q14 -24 0 -48" fill="none" stroke="#FDE7C7" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- coffee cup -->
  <path d="M600 210 h150 v120 a75 75 0 0 1 -75 75 h0 a75 75 0 0 1 -75 -75 z" fill="url(#cup)"/>
  <path d="M748 230 h22 a34 34 0 0 1 0 68 h-22 z" fill="none" stroke="#FDE7C7" stroke-width="10"/>
  <rect x="592" y="196" width="166" height="22" rx="11" fill="#FDE7C7"/>
  <rect x="600" y="392" width="150" height="16" rx="8" fill="#3b2410" opacity="0.5"/>

  <text x="90" y="500" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#FDF3E3">Java Mastery</text>
  <text x="90" y="540" font-family="Arial, sans-serif" font-size="26" fill="#FDE7C7" opacity="0.85">From Scratch to Interview-Ready</text>

  <rect x="90" y="565" width="64" height="6" rx="3" fill="#F59E0B"/>
</svg>
