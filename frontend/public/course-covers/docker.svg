<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Docker Essentials course cover">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="55%" stop-color="#0d2f45"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- stacked containers -->
  <g stroke="#67E8F9" stroke-width="3" opacity="0.6">
    <line x1="695" y1="330" x2="695" y2="180"/>
  </g>
  <g fill="#22D3EE">
    <rect x="615" y="290" width="56" height="56" rx="6" fill="#CFFAFE"/>
    <rect x="679" y="290" width="56" height="56" rx="6"/>
    <rect x="615" y="222" width="56" height="56" rx="6"/>
    <rect x="679" y="222" width="56" height="56" rx="6" fill="#CFFAFE"/>
    <rect x="647" y="358" width="56" height="56" rx="6" opacity="0.85"/>
  </g>

  <!-- speed chevrons -->
  <path d="M540 250 l24 20 l-24 20" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M508 250 l24 20 l-24 20" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <text x="90" y="500" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#ECFEFF">Docker Essentials</text>
  <text x="90" y="540" font-family="Arial, sans-serif" font-size="26" fill="#CFFAFE" opacity="0.85">Images · Containers · Compose · CLI</text>

  <rect x="90" y="565" width="64" height="6" rx="3" fill="#22D3EE"/>
</svg>
