<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Production Debugging course cover">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b0b"/>
      <stop offset="55%" stop-color="#4a1414"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- terminal window with log lines and a bug -->
  <g transform="translate(610 100)">
    <rect width="520" height="330" rx="22" fill="#0f0f14" stroke="#FCA5A5" stroke-width="3" opacity="0.97"/>
    <path d="M0 22 a22 22 0 0 1 22 -22 h476 a22 22 0 0 1 22 22 v28 h-520 z" fill="#27272f"/>
    <circle cx="32" cy="25" r="8" fill="#EF4444"/>
    <circle cx="58" cy="25" r="8" fill="#F59E0B"/>
    <circle cx="84" cy="25" r="8" fill="#22C55E"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="22">
      <text x="30" y="100" fill="#86EFAC">INFO  GET /orders 200 41ms</text>
      <text x="30" y="140" fill="#86EFAC">INFO  GET /cart   200 38ms</text>
      <text x="30" y="180" fill="#FCD34D">WARN  query took 4812ms</text>
      <text x="30" y="220" fill="#FCA5A5">ERROR POST /pay   500</text>
      <text x="30" y="260" fill="#FCA5A5">  KeyError: 'total_cents'</text>
      <text x="30" y="300" fill="#94A3B8">$ pytest -x</text>
    </g>
    <!-- bug -->
    <g transform="translate(430 215)" stroke="#FEE2E2" stroke-width="5" stroke-linecap="round" fill="none">
      <ellipse cx="0" cy="0" rx="26" ry="34" fill="#EF4444" stroke="none"/>
      <circle cx="0" cy="-40" r="14" fill="#EF4444" stroke="none"/>
      <line x1="-26" y1="-14" x2="-50" y2="-26"/><line x1="26" y1="-14" x2="50" y2="-26"/>
      <line x1="-27" y1="6" x2="-54" y2="6"/><line x1="27" y1="6" x2="54" y2="6"/>
      <line x1="-24" y1="24" x2="-48" y2="40"/><line x1="24" y1="24" x2="48" y2="40"/>
      <line x1="0" y1="-54" x2="0" y2="30" stroke="#7F1D1D" stroke-width="4"/>
    </g>
  </g>

  <path d="M540 250 l24 20 l-24 20" fill="none" stroke="#FCA5A5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M508 250 l24 20 l-24 20" fill="none" stroke="#FCA5A5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <text x="90" y="500" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#FEF2F2">Production Debugging</text>
  <text x="90" y="540" font-family="Arial, sans-serif" font-size="26" fill="#FEE2E2" opacity="0.85">Logs · Queries · Races · Fixes · Incident notes</text>

  <rect x="90" y="565" width="64" height="6" rx="3" fill="#FCA5A5"/>
</svg>
